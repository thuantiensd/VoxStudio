<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#4c3fb7"/>
      <stop offset="55%"  stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="pearl" cx="40%" cy="35%" r="70%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="45%"  stop-color="#e9e4ff"/>
      <stop offset="100%" stop-color="#a28bfc"/>
    </radialGradient>
    <linearGradient id="vrim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.72"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- Elevation dots (3 mức lan toả — voice → studio → thế giới) -->
  <g fill="#ffffff">
    <circle cx="128" cy="28" r="5"  opacity="0.45"/>
    <circle cx="128" cy="46" r="7"  opacity="0.70"/>
    <circle cx="128" cy="66" r="9"/>
  </g>

  <!-- V chalice — bình ngọc đựng pearl. Closed path = solid body -->
  <path
    d="M 50 94
       L 128 206
       L 206 94
       L 178 94
       L 128 166
       L 78 94
       Z"
    fill="url(#vrim)"
    stroke="#ffffff"
    stroke-width="2"
    stroke-linejoin="round"
  />

  <!-- Inner shadow for depth -->
  <path
    d="M 78 94 L 128 166 L 178 94"
    fill="none"
    stroke="#3f2f9e"
    stroke-opacity="0.22"
    stroke-width="3"
    filter="url(#soft)"
  />

  <!-- Pearl — viên ngọc cradled trong V -->
  <circle cx="128" cy="138" r="20" fill="url(#pearl)"/>
  <!-- Pearl highlight -->
  <ellipse cx="121" cy="131" rx="6" ry="4" fill="#ffffff" opacity="0.9"/>
</svg>
