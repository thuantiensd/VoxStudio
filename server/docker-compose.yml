services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: voxstudio/api:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DEVICE: cuda
      USE_FASTER_WHISPER: "true"
      FASTER_WHISPER_MODEL: large-v3-turbo
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      DIARIZE_BACKEND: ${DIARIZE_BACKEND:-resemblyzer}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - ./dubbing_projects:/app/dubbing_projects
      - ./voices:/app/voices
      - hf_cache:/root/.cache/huggingface
      - /tmp:/tmp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      redis:
        condition: service_started
    networks:
      - voxnet

  redis:
    image: valkey/valkey:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - voxnet

volumes:
  hf_cache:
  redis_data:

networks:
  voxnet:
    driver: bridge
